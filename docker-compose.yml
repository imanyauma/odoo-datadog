services:

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odoo17-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_HTTP_PORT:-8069}:8069"
      - "${ODOO_LONGPOLLING_PORT:-8072}:8072"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      WAIT_FOR_DB: "true"
    command:
      - python
      - odoo-bin
      - -c
      - /etc/odoo/odoo.conf
      - --db_host=db
      - --db_port=5432
      - --db_user=${POSTGRES_USER:-odoo}
      - --db_password=${POSTGRES_PASSWORD:-odoo}
    volumes:
      - odoo_data:/var/lib/odoo
      - odoo_logs:/var/log/odoo
      - ./addons:/opt/odoo/odoo-17/addons
      - ./docker/odoo.conf:/etc/odoo/odoo.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
  odoo_data:
  odoo_logs:

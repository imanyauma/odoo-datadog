[options]

; ===============================
; Server
; ===============================
admin_passwd = Admin0do0!
http_port = 8069
http_interface = 0.0.0.0
proxy_mode = True

; ===============================
; Paths
; ===============================
addons_path = /opt/odoo/odoo-17/addons
data_dir = /var/lib/odoo

; ===============================
; Database
; ===============================
db_host = 192.168.163.1
db_port = 5432
db_user = odoo
db_password = Odoo1234!!
db_maxconn = 64
db_sslmode = prefer

; ===============================
; Workers & Performance
; ===============================
workers = 4
max_cron_threads = 2
limit_time_cpu = 60
limit_time_real = 120
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560

; ===============================
; Logging
; ===============================
logfile = /var/log/odoo/odoo.log
log_level = info
logrotate = True

; ===============================
; Email (optional)
; ===============================
;smtp_server = smtp.gmail.com
;smtp_port = 587
;smtp_user = your@email.com
;smtp_password = yourpassword
;smtp_ssl = False
;smtp_tls = True
